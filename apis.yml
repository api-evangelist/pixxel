name: Pixxel
description: >-
  Pixxel is a hyperspectral Earth-observation company operating the Firefly
  constellation of hyperspectral imaging satellites and the Aurora platform, an
  Earth-observation studio for tasking, ordering, searching, and analyzing
  satellite imagery. Its public "stargate" API (api.pixxel.space) gives developers
  programmatic access to projects and areas of interest (AOIs), satellite tasking
  and ordering, a STAC-based imagery archive, cloud delivery, spectral indices and
  visualizations, and analytics workflows, jobs, and model insights across
  agriculture, mining, energy, forestry, environment, and government use cases.
  Authentication uses bearer Personal Access Tokens scoped by organization,
  project, and role.

problems:
- status: 400
  title: Bad Request
  meaning: Invalid or malformed input / parameters or request body.
- status: 401
  title: Unauthorized
  meaning: Token format is invalid or unrecognized.
  remediation: "Provide a valid 'Authorization: Bearer <PAT>' header."
- status: 403
  title: Forbidden
  meaning: Token is missing, expired, revoked, or lacks required role/project permissions.
  remediation: Check token expiry, roles, and project access in Aurora Settings.
- status: 404
  title: Not Found
  meaning: Referenced resource (AOI, order, job, catalog, collection item) does not exist.
- status: 409
  title: Conflict
  meaning: Request conflicts with current resource state (e.g. duplicate or invalid transition).
- status: 500
  title: Internal Server Error
  meaning: Server-side processing error.

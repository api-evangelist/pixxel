# Pixxel API error catalog — derived from OpenAPI 4xx/5xx responses
generated: '2026-07-20'
method: derived
source: openapi/pixxel-openapi-original.json
docs: https://docs.pixxel.space/developer/gettingstarted/authentication.md
format: custom-json
envelope:
  shape: '{ "error": { "code": <string>, "message": <string>, "details": <any> } }'
  schemas:
  - clerk.ErrorResponse
